name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,replay]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: dota-items report examples/match.synthetic.json --player-slot 0 --output reports/smoke
      - run: python coach.py --workspace coach-workspace/ci demo
      - run: python coach.py --workspace coach-workspace/ci doctor
  portable-workflow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_coach_workflow.py -q
      - run: python coach.py --workspace coach-workspace/ci demo
